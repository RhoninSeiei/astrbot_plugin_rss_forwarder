          <div><span class="brand-name">RSS Forwarder</span><h1>订阅管理</h1></div>
        </div>
        <button id="refresh" type="button" aria-label="刷新" title="刷新" disabled>&#8635;</button>
      </header>

      <div class="feedback" aria-live="polite">
        <p id="request-status" role="status">正在连接…</p>
        <p id="error-text" role="alert" hidden></p>
      </div>

      <section class="create-section" aria-labelledby="create-heading">
        <h2 id="create-heading">新建订阅</h2>
        <form id="create-form" aria-busy="true">
          <fieldset id="create-fields" disabled>
            <div class="field-grid">
              <div class="field url-field">
                <label for="rss-url">RSS URL</label>
                <input id="rss-url" name="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" required />
              </div>
              <div class="field">
                <label for="subscription-title">标题 <span class="muted">可选</span></label>
                <input id="subscription-title" name="title" type="text" autocomplete="off" />
              </div>
              <fieldset class="field targets-field">
                <legend>推送目标</legend>
                <div id="target-options" class="target-options"></div>
                <p id="targets-empty" class="muted">正在加载目标…</p>
              </fieldset>
              <fieldset class="field schedule-mode-field">
                <legend>排期模式</legend>
                <div class="segment-control">
                  <input id="mode-interval" name="schedule-mode" type="radio" value="interval" checked />
                  <label for="mode-interval">固定间隔</label>
                  <input id="mode-cron" name="schedule-mode" type="radio" value="cron" />
                  <label for="mode-cron">Cron</label>
                </div>
              </fieldset>
              <div id="interval-field" class="field">
                <label for="interval-minutes">间隔（分钟）</label>
                <input id="interval-minutes" type="number" min="1" step="1" value="5" required />
              </div>
              <div id="cron-field" class="field" hidden>
                <label for="cron-expression">Cron 表达式</label>
                <input id="cron-expression" type="text" placeholder="0 * * * *" autocomplete="off" spellcheck="false" disabled />
              </div>
            </div>
            <div class="form-actions"><button id="create-subscription" type="submit" disabled>创建订阅</button></div>
          </fieldset>
        </form>
      </section>

      <section class="list-section" aria-label="订阅列表">
        <div class="list-toolbar">
          <div class="tabs" role="tablist" aria-label="订阅类型">
            <button id="tab-feeds" type="button" role="tab" aria-selected="true" aria-controls="subscription-panel" data-kind="feeds">来源</button>
            <button id="tab-jobs" type="button" role="tab" aria-selected="false" aria-controls="subscription-panel" tabindex="-1" data-kind="jobs">轮询任务</button>
            <button id="tab-daily_digests" type="button" role="tab" aria-selected="false" aria-controls="subscription-panel" tabindex="-1" data-kind="daily_digests">日报</button>
          </div>
          <span id="revision" class="muted"></span>
        </div>
        <div id="subscription-panel" role="tabpanel" aria-labelledby="tab-feeds" tabindex="0">
          <div class="table-frame">
            <table>
              <caption id="table-caption" class="sr-only">来源</caption>
              <thead><tr>
                <th scope="col" class="id-column">ID</th>
                <th id="source-column" scope="col">地址</th>
                <th scope="col" class="schedule-column">排期</th>
                <th scope="col" class="enabled-column">启用</th>
              </tr></thead>
              <tbody id="subscription-rows"></tbody>
            </table>
          </div>
          <p id="list-empty" class="empty-state">正在加载订阅…</p>
        </div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
